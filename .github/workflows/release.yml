name: Release

# Publishes any package whose version is not yet on the registry. Version
# bumps are made locally with `pnpm changeset version` and committed, so this
# workflow needs no permission to open pull requests.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: github.repository_owner == 'i18n-inflect'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Use an npm that supports trusted publishing
        # Node 22 ships npm 10; OIDC publishing needs 11.5.1 or later. Safe to
        # upgrade here because publishing goes through npm directly — piping
        # it through `pnpm publish` is what broke on unknown CLI flags before.
        run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:dist
      - name: Publish
        run: node scripts/publish-npm.mjs
